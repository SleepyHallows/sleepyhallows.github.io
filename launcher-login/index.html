<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Sleepy Hallows</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0c0b10; color:#e9e6f0;
         font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif; }
  main { text-align:center; padding:24px; max-width:460px; }
  a { color:#8fa0ff; }
</style>
</head>
<body>
<main>
  <h1>Sleepy Hallows sign-in has moved</h1>
  <p>Taking you to <b>sleepyhallows.com</b>...</p>
  <p id="manual">If nothing happens, open the sign-in page from your launcher again.</p>
</main>
<script>
  // 2026-11-19: the sign-in page now lives only on sleepyhallows.com (strict security headers there). Launchers built
  // before that open this address, so it forwards the launcher's sign-in code to the same page there. Only the
  // "session" value is passed on, and only if it has the shape the launcher creates.
  (function () {
    var target = "https://sleepyhallows.com/launcher-login/";
    var s = new URLSearchParams(location.search).get("session");
    if (s && /^[A-Za-z0-9_-]{22}$/.test(s)) target += "?session=" + encodeURIComponent(s);
    var a = document.createElement("a");
    a.href = target;
    a.textContent = "Continue to the sign-in page";
    document.getElementById("manual").replaceChildren(a);
    location.replace(target);
  })();
</script>
</body>
</html>
